---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myapp-network-policy
  namespace: default
spec:
  podSelector: 
    matchLabels:
      app: myapp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
            podSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
              ports:
                - protocol: TCP
                  port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: myapp-database
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
            ports:
              - protocol: UDP
                port: 53
